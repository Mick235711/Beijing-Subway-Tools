name: Build native applications

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.label }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: macOS Apple Silicon
            runner: macos-15
            artifact: native-macos-arm64
            archive: Beijing-Subway-Tools-macos-arm64.zip
          - label: macOS Intel
            runner: macos-15-intel
            artifact: native-macos-x64
            archive: Beijing-Subway-Tools-macos-x64.zip
          - label: Windows x64
            runner: windows-2025
            artifact: native-windows-x64
            archive: Beijing-Subway-Tools-windows-x64.zip
          - label: Linux x64
            runner: ubuntu-22.04
            artifact: native-linux-x64
            archive: Beijing-Subway-Tools-linux-x64.tar.gz

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install build dependencies
        run: >-
          python -m pip install
          PyInstaller
          "nicegui[native]"
          Pillow
          pyjson5
          pypinyin
          questionary
          tabulate
          tqdm

      - name: Install Linux native backend
        if: runner.os == 'Linux'
        run: python -m pip install "pywebview[pyside6]"

      - name: Install Linux system libraries
        if: runner.os == 'Linux'
        run: >-
          sudo apt-get update &&
          sudo apt-get install --no-install-recommends --yes
          xauth
          xvfb
          libdbus-1-3
          libegl1
          libfontconfig1
          libgl1
          libglib2.0-0
          libnss3
          libx11-6
          libx11-xcb1
          libxcb1
          libxcb-cursor0
          libxcb-icccm4
          libxcb-image0
          libxcb-keysyms1
          libxcb-randr0
          libxcb-render-util0
          libxcb-shape0
          libxcb-shm0
          libxcb-sync1
          libxcb-xfixes0
          libxcb-xinerama0
          libxcb-xkb1
          libxcomposite1
          libxdamage1
          libxext6
          libxkbcommon0
          libxkbcommon-x11-0
          libxrandr2
          libxrender1

      - name: Build native application
        run: python scripts/pack_ui.py --clean --noconfirm

      - name: Package macOS application
        if: runner.os == 'macOS'
        run: |
          test -x "dist/Beijing Subway Tools.app/Contents/MacOS/Beijing Subway Tools"
          ditto -c -k --sequesterRsrc --keepParent \
            "dist/Beijing Subway Tools.app" \
            "${{ matrix.archive }}"

      - name: Package Windows application
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $executable = "dist\Beijing Subway Tools\Beijing Subway Tools.exe"
          if (-not (Test-Path $executable)) {
            throw "Expected executable was not created: $executable"
          }
          Compress-Archive -Path "dist\Beijing Subway Tools" -DestinationPath "${{ matrix.archive }}"

      - name: Test Linux application
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set +e
          timeout 20s xvfb-run -a "dist/Beijing Subway Tools/Beijing Subway Tools" >linux-smoke.log 2>&1
          status=$?
          set -e
          cat linux-smoke.log
          if [ "$status" -ne 124 ]; then
            echo "The Linux application exited before the smoke-test timeout with status $status"
            exit 1
          fi

      - name: Package Linux application
        if: runner.os == 'Linux'
        run: |
          test -x "dist/Beijing Subway Tools/Beijing Subway Tools"
          tar -C dist -czf "${{ matrix.archive }}" "Beijing Subway Tools"

      - name: Upload application
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.archive }}
          compression-level: 0
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish continuous build
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      actions: write
      contents: write
    env:
      GH_REPO: ${{ github.repository }}
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: continuous-build

    steps:
      - name: Download applications
        uses: actions/download-artifact@v8
        with:
          pattern: native-*
          path: release-assets
          merge-multiple: true

      - name: Generate checksums
        shell: bash
        run: |
          cd release-assets
          sha256sum Beijing-Subway-Tools-* >SHA256SUMS.txt
          ls -lh

      - name: Check for a newer main build
        id: current
        shell: bash
        run: |
          latest_sha=$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)
          if [ "$latest_sha" = "$GITHUB_SHA" ]; then
            echo "publish=true" >>"$GITHUB_OUTPUT"
          else
            echo "publish=false" >>"$GITHUB_OUTPUT"
            echo "Skipping continuous release because main has advanced to $latest_sha"
          fi

      - name: Replace continuous prerelease
        if: steps.current.outputs.publish == 'true'
        shell: bash
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release delete "$RELEASE_TAG" --cleanup-tag --yes
          fi
          gh release create "$RELEASE_TAG" \
            --target "$GITHUB_SHA" \
            --prerelease \
            --title "Continuous build" \
            --notes "Automated development build from commit $GITHUB_SHA. These unsigned binaries are replaced after each successful push to main." \
            release-assets/*

      - name: Remove transient workflow artifacts
        if: steps.current.outputs.publish == 'true'
        shell: bash
        run: |
          gh api --paginate \
            "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts?per_page=100" \
            --jq '.artifacts[].id' |
          while read -r artifact_id; do
            gh api --method DELETE "repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact_id"
          done
