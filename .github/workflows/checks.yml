name: Validate data and types

on:
  pull_request:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.15"]
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-ci.txt

      - name: Install validation dependencies
        run: python -m pip install -r requirements-ci.txt

      - name: Validate schemas and data
        run: python -m scripts.check_data schemas

      - name: Generate trains for every line
        run: python -m scripts.check_data trains

      - name: Type-check Python files
        run: python -m mypy .
